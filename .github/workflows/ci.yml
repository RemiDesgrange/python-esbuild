name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, types, offline tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
        if: matrix.python == '3.14'
      - run: uv run ruff format --check .
        if: matrix.python == '3.14'
      - run: uv run mypy
        if: matrix.python == '3.14'
      - run: uv run pytest

  build:
    name: Build wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1 # SOURCE_DATE_EPOCH defaults to the commit time
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run python scripts/build_wheels.py --out dist
      - name: Rebuild and compare (reproducibility)
        run: |
          uv run python scripts/build_wheels.py --out dist-again
          (cd dist && sha256sum *) > a.sum
          (cd dist-again && sha256sum *) > b.sum
          diff a.sum b.sum
          cat a.sum
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

  check-tags:
    name: Check that pip accepts every wheel's tags
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - name: Resolve esbuild-bin from dist/ for each target platform
        run: |
          set -eu
          for plat in \
            manylinux2014_x86_64 musllinux_1_1_x86_64 \
            manylinux2014_aarch64 musllinux_1_1_aarch64 \
            manylinux2014_armv7l musllinux_1_1_armv7l \
            manylinux2014_i686 manylinux2014_ppc64le manylinux2014_s390x \
            macosx_12_0_arm64 macosx_12_0_x86_64 \
            win_amd64 win_arm64 win32
          do
            echo "== $plat"
            python -m pip download --quiet --no-index --find-links dist --only-binary=:all: \
              --platform "$plat" --python-version 3.9 --dest "check/$plat" esbuild-bin
            ls "check/$plat"
          done

  test-installed:
    name: Installed wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15 # arm64
          - macos-15-intel # x86_64
          - windows-latest # x64
          - windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - name: Install the matching wheel from dist/ only
        run: python -m pip install --no-index --find-links dist esbuild-bin
      - run: python -m pip install pytest
      - run: esbuild --version
      - name: Run installed-wheel tests
        env:
          ESBUILD_BIN_INSTALLED_TEST: "1"
        run: python -m pytest -p no:cacheprovider tests/test_installed.py -v

  test-installed-alpine:
    name: Installed wheel (Alpine, musl)
    needs: build
    runs-on: ubuntu-latest
    container: python:3.13-alpine
    env:
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - run: python -m pip install --no-index --find-links dist esbuild-bin
      - run: python -m pip install pytest
      - run: esbuild --version
      - name: Run installed-wheel tests
        env:
          ESBUILD_BIN_INSTALLED_TEST: "1"
        run: python -m pytest -p no:cacheprovider tests/test_installed.py -v
