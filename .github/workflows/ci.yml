name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, types, offline tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
        if: matrix.python == '3.14'
      - run: uv run ruff format --check .
        if: matrix.python == '3.14'
      - run: uv run mypy
        if: matrix.python == '3.14'
      - run: uv run pytest

  build:
    name: Build wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1 # SOURCE_DATE_EPOCH defaults to the commit time
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run python scripts/build_wheels.py --out dist
      - name: Rebuild and compare (reproducibility)
        run: |
          uv run python scripts/build_wheels.py --out dist-again
          (cd dist && sha256sum *) > a.sum
          (cd dist-again && sha256sum *) > b.sum
          diff a.sum b.sum
          cat a.sum
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

  test-wheels:
    needs: build
    uses: ./.github/workflows/test-wheels.yml
