name: Test wheels

# Reusable: checks tags and tests the "wheels" artifact of the calling run on
# every tier 1 runner plus Alpine. Used by ci.yml and release.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-tags:
    name: Check that pip accepts every wheel's tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - name: Resolve esbuild-bin from dist/ for each target platform
        run: |
          set -eu
          for plat in \
            manylinux2014_x86_64 musllinux_1_1_x86_64 \
            manylinux2014_aarch64 musllinux_1_1_aarch64 \
            manylinux2014_armv7l musllinux_1_1_armv7l \
            manylinux2014_i686 manylinux2014_ppc64le manylinux2014_s390x \
            macosx_12_0_arm64 macosx_12_0_x86_64 \
            win_amd64 win_arm64 win32
          do
            echo "== $plat"
            python -m pip download --quiet --no-index --find-links dist --only-binary=:all: \
              --platform "$plat" --python-version 3.11 --dest "check/$plat" esbuild-bin
            ls "check/$plat"
          done

  test-installed:
    name: Installed wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15 # arm64
          - macos-15-intel # x86_64
          - windows-latest # x64
          - windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - name: Install the matching wheel from dist/ only
        run: python -m pip install --no-index --find-links dist esbuild-bin
      - run: python -m pip install pytest
      - run: esbuild --version
      - name: Run installed-wheel tests
        env:
          ESBUILD_BIN_INSTALLED_TEST: "1"
        run: python -m pytest -p no:cacheprovider tests/test_installed.py -v

  test-installed-alpine:
    name: Installed wheel (Alpine, musl)
    runs-on: ubuntu-latest
    container: python:3.13-alpine
    env:
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - run: python -m pip install --no-index --find-links dist esbuild-bin
      - run: python -m pip install pytest
      - run: esbuild --version
      - name: Run installed-wheel tests
        env:
          ESBUILD_BIN_INSTALLED_TEST: "1"
        run: python -m pytest -p no:cacheprovider tests/test_installed.py -v
