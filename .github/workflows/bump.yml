name: Bump esbuild

# Opens a PR moving ESBUILD_VERSION to the next upstream release (never skipping
# one). A human reads the changelog, merges, and pushes the tag; nothing here
# publishes.
#
# PRs opened with the default GITHUB_TOKEN do not trigger other workflows, so CI
# would not run on them. Set a BUMP_TOKEN secret (a fine-grained PAT or GitHub
# App token with contents + pull-requests write) to get CI on bump PRs.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - id: check
        run: uv run python scripts/check_upstream.py --write
      - if: steps.check.outputs.version != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          branch: bump/esbuild-${{ steps.check.outputs.version }}
          commit-message: "Bump esbuild to ${{ steps.check.outputs.version }}"
          title: "Bump esbuild to ${{ steps.check.outputs.version }}"
          body: |
            Moves `ESBUILD_VERSION` to **${{ steps.check.outputs.version }}** (npm latest: ${{ steps.check.outputs.latest }}).

            Changelog: ${{ steps.check.outputs.changelog }}

            Before merging, read the changelog. esbuild is 0.x, so a minor release can break consumers. After merging, push the tag `v${{ steps.check.outputs.version }}` to release.
          add-paths: ESBUILD_VERSION
          delete-branch: true
